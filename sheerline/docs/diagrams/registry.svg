<svg width="100%" viewBox="0 0 680 512" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Sheerline: the 13-area practice registry</title>
<desc>Thirteen design-practice areas as one flat, tagged capability registry, grouped Craft (eight), Operating (four), and Conditional (one). Each area carries a coverage state shown by a colored bar: deep (Visual Design, Design Systems), covered (Wireframing and Prototyping, User Research, Information Architecture, Content Design, Interaction Design, Business Acumen, Service Design), partial (Accessibility, Design Strategy, Collaboration and Facilitation, DesignOps). Zero gaps and zero stubs remain. Each area also carries the phase that governs or fills it: P1, P1.5, P2, P3, or D-3. Only active, governed areas ever enter a session.</desc>
<!-- Sheerline · Figure 3 of 6: The 13-area practice registry. See docs/architecture.md. -->

<style>
.d{font-family:'Sora',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;}
.b{font-family:'Lora',Georgia,'Times New Roman',serif;}
.m{font-family:'DM Mono','SFMono-Regular',ui-monospace,'Cascadia Mono','Courier New',monospace;}
.paper{fill:#FAFAF5;}
.ink{fill:#1A1A1A;}.soft{fill:#6B6560;}.faint{fill:#8B857C;}
.cell{fill:#F6F4EE;stroke:#DDD7CB;stroke-width:1;}
.tag{fill:#FBFAF6;stroke:#DDD7CB;stroke-width:1;}
.bar-deep{fill:#0B6E75;}.bar-covered{fill:#6FB3B8;}.bar-partial{fill:#8A7CE0;}.bar-gap{fill:#C9C3B8;}
.t-deep{fill:#0B6E75;}.t-covered{fill:#3E7C80;}.t-partial{fill:#5B4FC7;}.t-gap{fill:#8B857C;}
@media (prefers-color-scheme:dark){
.paper{fill:#1A1A1A;}.ink{fill:#F3F0E8;}.soft{fill:#A8A399;}.faint{fill:#7E7970;}
.cell{fill:#242320;stroke:#3E3B34;}
.tag{fill:#2E2C27;stroke:#3E3B34;}
.bar-deep{fill:#5FD3DB;}.bar-covered{fill:#3E7C80;}.bar-partial{fill:#6A5FC0;}.bar-gap{fill:#4A473F;}
.t-deep{fill:#5FD3DB;}.t-covered{fill:#7FBDC1;}.t-partial{fill:#B0A6F0;}.t-gap{fill:#9A948A;}
}
</style>

<rect class="paper" x="0" y="0" width="680" height="512"/>

<text class="m faint" x="40" y="36" font-size="10.5" letter-spacing="1.6">SHEERLINE</text>
<text class="d ink" x="40" y="62" font-size="21" font-weight="600">The 13-area practice registry</text>
<text class="b soft" x="40" y="84" font-size="12.5">One flat, tagged capability registry. Coverage is a tracked state, not an invisible absence.</text>

