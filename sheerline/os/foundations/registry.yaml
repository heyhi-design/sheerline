# Sheerline: the 13-area practice registry
#
# A flat, tagged capability registry (not a two-tier tree). Each area carries a coverage
# state so gaps are tracked, not invisible. This is a propagation surface: structured
# fields over prose. Locked taxonomy per design-practice-harness-architecture-2026-07-29.md
# § 2 and plan-sheerline-v1-build-2026-07-30.md § 4; per-area skill map per
# sheerline-skill-buildout-research-2026-08-09.md § 1c / § 7b / § 8.
#
# nature   : craft | operating | conditional
# coverage : deep | covered | partial | gap        (design-practice coverage, not keel-layer)
# elevated : true when a partial area is a governed-practice elevation target (area 8 only)
# phase    : the phase that governs or fills this area (P1 | P1.5 | P2 | P3 | D-3)
# foundation: deep-manifest | governance | stub | deferred | governance-invariant
#             (deep-manifest / governance / stub folders exist in P1; deferred = later phase)
# build_gate: what unblocks the net-new build for this area
# maturity  : the finer practice-CAPABILITY instrument (Phase-B, DF-01 W1). A SIBLING of
#             `coverage`, not a replacement. `coverage` answers "does >=1 skill + foundation
#             EXIST" (a coarse existence tag); `maturity` answers "how GOOD/mature is the
#             practice" on a Dreyfus-shaped 1-5 rung scale. They are orthogonal and never
#             conflict: `coverage` stays the canonical existence tag, `maturity` never
#             overrides it, and a maturity read never moves a coverage value. Ships all-null
#             (ungraded) until graded. This is the INTERNAL "practice-capability level," never
#             the client-facing design-system-maturity-model.md (shared 1-5 numeral, nothing
#             else). Rungs + evidence classes + how `indirect` evidence is derived:
#             os/foundations/maturity/{LEVELS.md, EVIDENCE-CLASSES.md}. Derived and graded by
#             sheerline/skills/evals/measure_maturity.py; advisory only (zero deterministic
#             gates). Field shape per area:
#   maturity.level        : 1-5 | null (ungraded). 1 Scaffolded / 2 Situated / 3 Governed /
#                           4 Calibrated / 5 Exemplary. null when no rung is authored (SFIA:
#                           not every level is meaningful yet). Monotonic-by-agent: only a
#                           human lowers a stored level (the "maturity can regress" property).
#   maturity.target       : 1-5 | null. Owner-set aspiration. delta(target, level) = the
#                           roadmap line for the area (CMMI achievement-vs-target framing).
#   maturity.evidence     : direct[] / indirect[] / affirmation[] (SCAMPI-style classes; a
#                           rating is never made on artifacts alone -- affirmation required
#                           for the top rungs).
#   maturity.last_graded  : ISO date | null.
#   maturity.re_grade_due : bool, derived by measure_maturity.py from the cadence anchor;
#                           never hand-set.

