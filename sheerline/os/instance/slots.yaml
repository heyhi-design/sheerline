# Sheerline slot registry: every place a scaffold skill reads an instance's value.
#
# A slot is a named hole in the scaffold. The scaffold ships the slot with a generic default;
# an instance fills it from its own instance root (sheerline/os/instance/README.md). Skills ask
# the resolver for a slot (resolve.py), never for an instance's file by name, and the export
# derives its exclusions from this registry by path class instead of a hand-kept list.
#
# Per slot:
#   id                    stable slot id, `<area>.<name>`
#   owner                 the skill (or `sheerline`) whose consumers read the slot
#   kind                  calibration | brand | ratified | contract | history
#   format                python-module | json | markdown | generated | paths
#   requires_ratification true when a value is not usable until its owner ratifies it
#   consumers             the languages that read it (python, node, markdown)
#   default               the generic default, repo-relative and present wherever the scaffold
#                         is (monorepo and export alike), or null (the slot has no generic value)
#   optional              true when a blank instance legitimately has no value (history)
#   derived_from          a slot whose resolved value this one is generated from
#   generator             the script that generates a derived slot's file
#   in_tree               the path class: where a pointer-mode instance keeps this slot's value
#                         inside a shipped root today. Never ships; the export excludes every
#                         path here plus every path a registered instance fills a slot with.
#   values                format-specific fields the resolver reports (and `--check --expect`
#                         compares): attribute names for python-module, dotted keys for json,
#                         frontmatter keys for markdown
#
# Grammar: this file is read by a stdlib-only loader (resolve.py), so it keeps to block
# mappings, block sequences, plain or quoted scalars, and flow lists of scalars.
#
# Adding a slot: declare it here, give it a generic default (or null + optional), name its
# in_tree path class if an instance keeps the value inside a shipped root, and fill it in each
# instance's instance.yaml. Nothing is added to an exclusion list by hand.

# Scaffold copy (generated by the export). The in_tree entries that named the source
# instance's own excluded paths are removed; an instance records its own layout in its
# instance.yaml fills.


schema: sheerline-slots/1

slots:

  - id: vectorize.calibration
    owner: heyhi-design-bridge
    kind: calibration
    format: python-module
    requires_ratification: true
    consumers: [python]
    default: heyhi-skills/heyhi-design-bridge/scripts/vectorize/presets.py
    optional: false
    in_tree: []
    values: [PALETTE, ACCENTS, GOLDENS, CEILINGS]
    note: >-
      The Vectorize palette lock, accents, goldens, and anchor ceilings. The default is the
      generic block in presets.py (no palette, unratified ceilings with null targets); an
      instance's calibration module carries the same names with ratified values.

  - id: ui-studio.default-brand
    owner: ui-studio
    kind: brand
    format: json
    requires_ratification: false
    consumers: [python, node]
    default: heyhi-skills/ui-studio/brand-config/example.json
    optional: false
    in_tree: []
    values: [brand.name, meta.version]
    note: >-
      The brand config a ui-studio build uses when no config is named. Node readers
      (tokens-build/prep.mjs, the design-bridge scene-graph extractor) read it from
      resolved-slots.json in the instance root.

  - id: ui-studio.cursor-rules
    owner: ui-studio
    kind: brand
    format: generated
    requires_ratification: false
    consumers: [markdown]
    default: null
    optional: false
    derived_from: ui-studio.default-brand
    generator: heyhi-skills/ui-studio/scripts/cursor-export.py
    in_tree: [heyhi-skills/ui-studio/.cursor/rules/ui-studio.mdc]
    values: [description]
    note: >-
      The Cursor rules file, generated from the resolved default brand. With no instance
      fill it resolves to its source slot's value: generate from that.

  - id: care.adoption-contract
    owner: design-system-care-monthly
    kind: ratified
    format: markdown
    requires_ratification: true
    consumers: [markdown]
    default: sheerline/os/instance/defaults/care.adoption-contract.md
    optional: false
    in_tree: [heyhi-skills/design-system-care-monthly/references/adoption-definitions-contract.md]
    values: [status, ratified_by, version, effective_date]
    note: >-
      The G-W4 production-code adoption metric-definitions contract. The default is the
      unratified methodology; an instance's ratified copy records who signed off and when.

  - id: audit.conformance-calibration
    owner: heyhi-design-intelligence-audit
    kind: calibration
    format: markdown
    requires_ratification: false
    consumers: [markdown]
    default: sheerline/os/instance/defaults/audit.conformance-calibration.md
    optional: false
    in_tree: []
    values: []
    note: >-
      The Gate G2 conformance calibration: one instance's known-good and known-bad run
      against its own DESIGN.md. The default is a blank record a new instance fills.

  - id: content.shared-vocabulary
    owner: microcopy-states-writer
    kind: ratified
    format: markdown
    requires_ratification: true
    consumers: [markdown]
    default: sheerline/os/instance/defaults/content.shared-vocabulary.md
    optional: false
    in_tree: []
    values: [status, ratified_by, version, effective_date]
    note: >-
      The instance's versioned shared vocabulary (the area-3 slot). The default ships the term
      shape and no terms; an instance fills it with its ruled terms. A term changes only by its
      owner's ruling, and every ruling bumps the version.

  - id: history.decision-log
    owner: sheerline
    kind: history
    format: markdown
    requires_ratification: false
    consumers: [markdown]
    default: null
    optional: true
    in_tree: [sheerline/os/decision-log.md]
    values: []
    note: >-
      The instance's decision log. Template, shipped at this path in the export, is the
      overlay's blank decision log.

  - id: history.project-state
    owner: sheerline
    kind: history
    format: markdown
    requires_ratification: false
    consumers: [python]
    default: null
    optional: true
    in_tree: [sheerline/os/project-state.yaml]
    values: []
    note: >-
      The instance's machine-readable state. Template, shipped at this path in the export, is
      a structural projection with the instance narrative removed.

  - id: history.studio-snapshot
    owner: sheerline
    kind: history
    format: generated
    requires_ratification: false
    consumers: [node]
    default: null
    optional: true
    in_tree: [sheerline/studio/data/snapshot.js]
    values: []
    note: >-
      The Studio's data snapshot. Regenerated from whatever tree it sits in, so an export
      reflects only what ships.

  - id: history.build-records
    owner: sheerline
    kind: history
    format: paths
    requires_ratification: false
    consumers: [markdown]
    default: null
    optional: true
    in_tree: []
    values: []
    note: >-
      Records of how the instance built or audited its own copy of a skill (implementation
      audits, gap plans, calibration run reports). Instance history, never method.

  - id: interaction.pattern-catalog
    owner: interaction-inventory
    kind: ratified
    format: markdown
    requires_ratification: true
    consumers: [markdown]
    default: sheerline/os/instance/defaults/interaction.pattern-catalog.md
    optional: false
    in_tree: []
    values: [status, ratified_by, version, effective_date]
    note: >-
      The instance's cross-surface UX pattern catalog (the area-4 slot). The default ships the
      entry shape and no entries; an instance fills it with patterns harvested from its own
      surfaces and ratifies it. Open calls stay the owner's.

