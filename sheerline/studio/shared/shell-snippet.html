<!-- ============================================================================
     WHEELHOUSE - shared shell snippet   (FROZEN after DISPATCH-03 merges)
     HeyHi Confidential

     HOW TO USE (wave-3 lanes, paste verbatim, do not edit shared/):
       1. In your page <head>: <link rel="stylesheet" href="shared/studio.css">
          and the two <meta> lines shown in index.html's <head>.
       2. Paste this ENTIRE block as the first thing inside <body>.
       3. Put your screen's markup between the two PAGE CONTENT markers below.
       4. Do NOT add a second <script src="data/snapshot.js">; this snippet
          already loads the data global, first, in the right order.
       5. Page-scoped styles go in a page <style> with a
          /* candidate for shared */ comment. Only D-08 folds them back.

     This snippet self-activates the correct rail item from the page filename
     and fills the footer commit from the snapshot, no per-page edits needed.
     ============================================================================ -->
<script src="data/snapshot.js"></script>

<script>
/* fill footer commit + self-activate the rail item from the page filename */
(function () {
  var data = window.SHEERLINE_DATA || {};
  var meta = data.meta || {};
  var el = document.querySelector('[data-commit]');
  if (el) { el.textContent = meta.source_commit || 'unknown'; }

  var path = location.pathname.split('/').pop() || 'index.html';
  if (path === '') { path = 'index.html'; }
  var alias = {
    'quality-grade.html': 'quality-validate.html',
    'quality-learn.html': 'quality-validate.html',
    'exit-gate.html': 'session.html'
  };
  var target = alias[path] || path;
  var links = document.querySelectorAll('.rail__link');
  for (var i = 0; i < links.length; i++) {
    if (links[i].getAttribute('href') === target) {
      links[i].setAttribute('aria-current', 'page');
    } else {
      links[i].removeAttribute('aria-current');
    }
  }
})();
</script>
