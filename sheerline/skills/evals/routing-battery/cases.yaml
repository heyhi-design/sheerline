# Sheerline routing battery — regression guard over the 2026-08-22 skills-audit § 3.2 query table.
#
# Run after ANY edit to either registry (data OR engine):
#     python3 sheerline/skills/evals/routing-battery/run_battery.py
#
# "expect" is a capability id. registry: main = ai-services/agentic-infrastructure,
# subset = sheerline/skills/registry (the design harness). A regression flips a PASS to FAIL.
# A `status: known_gap` row is a documented residual, reported separately, never a hard fail.
#
# Provenance: authored wave R-6 of plans/plan-sheerline-skills-upgrade-2026-08-22.md, after
# waves R-1…R-5 fixed the routing failures the audit measured. Baseline captured 2026-08-23.
classification: confidential

meta:
  updated: "2026-09-05"
  registries:
    main: "ai-services/agentic-infrastructure/{skill-registry.py,skill-registry.yaml}"
    subset: "sheerline/skills/registry/{skill-registry.py,skill-registry.yaml}"

# ── Routing: every built skill wins its own registered triggers ──────────────
