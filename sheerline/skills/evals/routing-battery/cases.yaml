    status: known_gap
    note: >
      Main registry only: heyhi-session-validator wins the bare two-word probe on tag volume
      for the generic word "check" (the documented uncapped semantic-tag loop, skill-registry.py
      ~line 730). The design harness (subset) routes dmm #1, and every natural phrasing routes
      dmm #1 on both registries. Forcing the probe would mean nerfing an incumbent the audit
      never flagged, or an engine cap Q-1 held out of scope. Tracked, not forced.

  # R-2: heyhi-figjam-mapper wins the build-a-blueprint query on both registries
  - query: "build a service blueprint"
