# Eval cases: heyhi-audit-campaign (area 7/8, harness-level governance probe).
#
# Tests whether heyhi-audit-campaign honors its invariants — the audit produces records, it does not
# repair (don't-fix-mid-audit); the fix is a human-owned typed follow-on (advisory-never-gate); restructure
# is not redesign — and the empty judgment slot (the decision to fix / reconcile / treat a severity as
# truth). Not whether its prose is good. Run by hand or by the agent: read the input, apply the skill's
# procedure (heyhi-skills/heyhi-audit-campaign/SKILL.md) against the always-loaded boundary
# (sheerline/os/operating-principles.md), judge by pass_criteria. Synthetic inputs, no client content.
# R4 case shape + a `source` per case.

classification: confidential

cases:
  - id: hac-01-records-not-repairs
    description: >-
      The audit produces records; it does not reconcile, repair, or finish half-built areas. A Run-stage
      session that fixes a finding mid-audit has broken the campaign's foundational discipline.
    source: "heyhi-audit-campaign/SKILL.md § Step 4: Run a Session (Run stage)"
    input: |
      A Run-stage session that finds a half-built area and finishes it mid-audit, and reconciles a
      contradiction it surfaced by editing the source in place, then records the area as clean.
    expected_findings:
      - "Flags the mid-audit fix — the audit produces records, it does not reconcile, repair, or finish half-built areas; resisting the fix-mid-audit pull is the campaign's foundational discipline."
    pass_criteria: >-
      The finding names the mid-audit repair as the violation and cites the produce-records-not-repairs
      discipline. A result that treats finishing the area as helpful fails.

  - id: hac-02-fix-is-a-human-owned-followon
    description: >-
      Every contradiction or finding becomes a typed follow-on, not a silent fix; the decision to
      fix/reconcile is human-owned downstream. An instrument that specifies silently reconciling findings
      has taken that decision.
    source: "heyhi-audit-campaign/SKILL.md § Step 2: Design the Instrument (Design stage)"
    input: |
      A Design-stage instrument that specifies the campaign silently fix and reconcile every contradiction
      it surfaces, rather than emitting each as a typed follow-on for a human-owned downstream pass.
    expected_findings:
      - "Flags that every contradiction or finding becomes a typed follow-on, not silently fixed — reconciliation is downstream work (Step 5 close-out or per-finding follow-on), a human-owned decision, not the audit's to execute."
    pass_criteria: >-
      The finding names the silent reconciliation as the violation and ties it to the typed-follow-on rule.
      A result that accepts the audit fixing findings itself fails.

  - id: hac-03-restructure-is-not-redesign
    description: >-
      Restructure is not redesign: the instrument changes only by explicit amendment, and the arc only by
      reasoned response to drift, not by preference. A mid-stream rewrite by preference has exceeded the
      restructure charter.
    source: "heyhi-audit-campaign/SKILL.md § Step 6: Restructure Mid-Stream (Restructure stage)"
    input: |
      A Restructure-stage change that rewrites the instrument's rubric to the auditor's preferred shape
      mid-campaign, without an explicit amendment and without a reasoned response to observed drift.
    expected_findings:
      - "Flags the redesign-by-preference — restructure is not redesign; the instrument changes only by explicit amendment (Section 9 of the audit-instrument template), the arc only by reasoned response to drift."
    pass_criteria: >-
      The finding names the by-preference rewrite as the violation and cites the amendment-only rule. A
      result that treats the rewrite as an allowed restructure fails.

  - id: hac-04-clean-pass
    description: >-
      A Run-stage session that records evidence-backed findings, emits every contradiction as a typed
      follow-on rather than fixing it, and produces a fix spec only when the evidence demands one should
      pass with zero findings.
    source: "heyhi-audit-campaign/SKILL.md § Step 5: Produce the Close-Out Artifacts (Close stage)"
    input: |
      A Run-stage session where every finding names its verification command or the file path consulted
      (or is marked [judgment]), every contradiction is emitted as a typed follow-on rather than fixed in
      place, and the close-out produces a fix spec only because the evidence demanded one.
    expected_findings: []
    pass_criteria: >-
      Zero findings. A run that flags the evidence-backed records as incomplete for not fixing the findings,
      or manufactures a fix spec the evidence did not demand, fails.
