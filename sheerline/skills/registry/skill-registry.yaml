# Sheerline: design-scoped capability registry.
#
# Routed by the reused keel engine (skill-registry.py, R2). Registers the 13 practice areas
# (as references pointing at their foundations) + the deployed design-practice skills. The
# engine's confidence gate abstains ("insufficient") on out-of-scope queries: that honest
# abstention is the point: Sheerline routes design work and declines everything else.
#
# Skills live in heyhi-skills/ (referenced, never copied). The canonical full deployed-skill
# roster is HeyHi's own skill-registry.yaml; this registry indexes the design-practice subset
# Sheerline governs. Per-entry schema matches keel's (id, name, type, description,
# semantic_tags, trigger_patterns, dependencies, not_for, load_cost_tokens, location).

