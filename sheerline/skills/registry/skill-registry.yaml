  - id: taxonomy-labeling-auditor
    name: "Taxonomy Labeling Auditor"
    type: skill
    area: 2
    # audit taxonomy/labels/scent + draft the machine-readability schema (area 2, net-new, most durable IA value). Deployed 2026-09-07 (D-3 open), proved first on a client engagement; area 2 partial -> covered. The heyhi-aeo schema seam is the differentiator.
    description: >-
      Audit a product's taxonomy, labels, and information scent, and draft the machine-readability
      schema layer — without choosing the labels. A label-consistency pass (controlled + user
      vocabulary, flagging designer-coinage), an information-scent pass (node- and path-linked), a
      polyhierarchy / metadata review, and a candidate structured-content schema. The label choices,
      the granularity, and the restructure stakes ship empty behind a named gate. heyhi-aeo seam:
      this makes the taxonomy machine-readable; heyhi-aeo optimizes it for citation.
    semantic_tags: [taxonomy audit, labeling audit, information scent, label consistency, polyhierarchy, metadata, machine-readability schema, controlled vocabulary, user vocabulary, information architecture, structured content, findability of labels]
    trigger_patterns: ["audit the taxonomy", "audit label consistency", "is the labeling consistent", "check information scent", "review the polyhierarchy", "draft the machine-readability schema for the taxonomy", "are these labels from user vocabulary", "taxonomy and labeling audit"]
    dependencies:
      - heyhi-skills/taxonomy-labeling-auditor/references/taxonomy-canon.md
      - os/foundations/information-architecture/FOUNDATION.md
    not_for:
      - "Optimize content for answer-engine citation, AI Overviews, or getting cited by ChatGPT / Perplexity (use heyhi-aeo)"
      - "Tokens, components, or design-system health and drift, not the content taxonomy (use heyhi-design-intelligence-audit)"
      - "Choosing the labels, the granularity, or the restructure stakes — the human's, always; this skill's named gate"
    load_cost_tokens: 4915
    location: heyhi-skills/taxonomy-labeling-auditor/SKILL.md

