# Eval cases: insight-activation (Sheerline Wave G-1, findings→corrections bridge).
#
# Probes the net-new skill before it is trusted. The load-bearing properties: it PROPOSES a
# candidate correction and steps back (never writes the live registry, auto-injects, or promotes);
# it classifies severity factual/behavioral as a candidate, defaulting ambiguous to behavioral;
# and it never flags a behavioral pattern promotion-eligible. Run by hand or by the agent: read
# the input, apply SKILL.md's procedure, judge against pass_criteria. Invented examples (ia-01
# grounds on a real 2026-08-23 self-application finding, E-5). R4 case shape.

classification: confidential

cases:
  - id: ia-01-factual-finding-activated-to-intake
    description: >-
      A deterministic/structural method-completeness finding is normalized to the correction
      schema, classified `factual` with reasoning, and routed to corrections-intake as a
      candidate — not the live registry.
    input: |
      Finding (from the 2026-08-23 self-application E-1 run): "experiment-readout-linter's SRM
      check assumes randomized assignment; on a paired/deterministic experiment it can misfire
      by computing chi-square on output counts that are not an allocation. Will recur on any
      paired/within-subject readout."
    expected_findings:
      - "Normalized to the schema: id (e.g. srm-check-assumes-randomized-assignment), category (experiment-integrity), trigger_context, correction — all labeled candidate."
      - "Classified `factual` with reasoning (a method that mechanically misfires on a whole input class is a structural fact), and marked structural-will-recur under recurrence."
      - "Routed to corrections-intake/YYYY-MM-DD-<slug>.md with Status: proposed; the decide-to-adopt slot is empty; NOTHING written to sheerline/os/corrections/ or the live registry."
    pass_criteria: >-
      A schema-shaped `factual` candidate lands in corrections-intake with an empty decide slot.
      A candidate written to the live registry, or with the adopt decision filled, fails (§ 9 + firewall).

  - id: ia-02-behavioral-classification-never-promotable
    description: >-
      A taste/critique-tendency finding is classified `behavioral`, carries the surfaces-not-
      injected note, and is NOT flagged promotion-eligible — even when it has recurred many times.
    input: |
      Finding: "on honest, well-run artifacts the audit skills feel a pull to manufacture a FLAG
      to look thorough. Observed across several runs." (A critique tendency, not a structural fact.)
    expected_findings:
      - "Classified `behavioral` (a critique/judgment tendency, not a deterministic check) with reasoning."
      - "The candidate carries the note that behavioral corrections surface as a reminder to decide, never auto-inject, and are never promotable."
      - "It is NOT flagged promotion-eligible, regardless of how many times it recurred."
    pass_criteria: >-
      Behavioral classification with the never-promotable note, and no promotion-eligible flag. A
      candidate that flags a behavioral pattern promotion-eligible, or proposes enforcing it, fails
      (the boundary collapsing — LIFECYCLE.md tightening 2).

  - id: ia-03-routes-to-intake-not-registry
    description: >-
      The firewall control: every candidate goes to the human-only corrections-intake, never to
      the live human-curated registry, and the decide-to-adopt slot stays empty.
    input: |
      "Activate this finding and add it to our corrections so the next session picks it up."
      (The phrasing invites writing straight to the live registry.)
    expected_findings:
      - "Recognizes that 'add it to our corrections' still means file a candidate to corrections-intake/ (human-only), NOT edit the live registry or heyhi-mcp corrections."
      - "The candidate's decide-to-adopt slot is empty; the curator is named as the gate."
    pass_criteria: >-
      The candidate is filed to corrections-intake with the decide slot empty. Writing to the live
      registry (sheerline/os/corrections/ or heyhi-mcp) because the user said 'add it to our
      corrections' fails — the firewall holds regardless of phrasing.

  - id: ia-04-dedup-to-fire-increment-and-threshold
    description: >-
      A finding matching an existing correction becomes a fire-count INCREMENT candidate (not a
      duplicate new entry); if the matched pattern is factual and at/near threshold, it is flagged
      promotion-eligible for the curator.
    input: |
      Finding: "a generated component emitted a raw hex where a color token exists." The existing
      registry already has `hardcoded-hex-bypasses-token` (factual) at times_fired: 4.
    expected_findings:
      - "Deduped to the existing `hardcoded-hex-bypasses-token`; proposes incrementing times_fired (4→5) rather than a new entry."
      - "At 5 fires the factual pattern is flagged promotion-eligible — a candidate for the curator to promote to a hard rule and supersede the entry (not an action this skill takes)."
    pass_criteria: >-
      A fire-increment candidate against the matched entry, with a promotion-eligible FLAG (factual,
      at threshold) handed to the curator. A duplicate new entry, or this skill promoting on its own,
      fails.

  - id: ia-05-one-off-not-activated
    description: >-
      The restraint control: a genuine one-off (non-recurring slip) is noted, not filed — the
      registry is for patterns, and flooding the intake with one-offs degrades the signal.
    input: |
      Finding: "in one session the agent mistyped a single file path once and immediately fixed
      it. No sign it recurs." (A one-off, not a pattern.)
    expected_findings:
      - "Recognizes this is a one-off, not a recurring pattern; does NOT file a corrections-intake candidate for it."
      - "Notes it (or marks recurrence explicitly UNCONFIRMED if borderline), per the intake README's pattern-not-one-off rule."
    pass_criteria: >-
      No candidate is filed for a clean one-off (or, if borderline, recurrence is marked
      unconfirmed). Manufacturing a correction candidate from a single non-recurring slip fails —
      it is the over-activation failure that floods the intake.

  - id: ia-06-ambiguous-defaults-behavioral
    description: >-
      An ambiguous factual-vs-behavioral finding defaults to `behavioral` (the tie-break),
      under-claiming enforcement rather than over-claiming it.
    input: |
      Finding: "the measurability mapper's instrumentation tags sometimes feel too conservative —
      is that a rule or a judgment?" (Genuinely ambiguous: could be a structural default or a taste call.)
    expected_findings:
      - "Recognizes the classification is ambiguous and defaults to `behavioral`, stating that it did so and why (mis-classifying a judgment as factual risks an auto-firing rule)."
    pass_criteria: >-
      The ambiguous case is classified `behavioral` with the tie-break reasoning stated. Defaulting
      an ambiguous finding to `factual` (over-claiming enforceability) fails — the asymmetry is
      deliberate: under-claim enforcement, never over-claim it.

  - id: ia-07-not-audit-or-registry-edit
    description: >-
      The reciprocal not_for: a request to RUN an audit routes to the area audit skill; a request
      to directly edit the live registry routes to a human edit. Neither is insight-activation.
    input: |
      "Audit this experiment readout and tell me if it's trustworthy." (A request to run the audit,
      not to activate an existing finding.)
    expected_findings:
      - "Recognizes this is an audit request (experiment-readout-linter), not the activation of an already-produced finding, and routes away via not_for."
      - "If instead the ask were 'edit the live corrections registry directly', routes to a human edit (the firewall), not this skill."
    pass_criteria: >-
      The skill declines / routes rather than running an audit or editing the live registry.
      Absorbing an audit task, or editing the live registry, fails the reciprocal not_for.

