# Sheerline structural checks. Inert in the monorepo (this file sits under
# releases/private/sheerline/overlay/); live only in the exported private repo.
# Minute-light on purpose (the org shares a small monthly Actions budget): one ~30s
# job, on pushes to main, on pull requests, and on demand.
# classification: confidential (HeyHi Confidential)
name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet 'pyyaml==6.0.2'
      - name: Router routes a known query
        run: |
          out=$(python3 sheerline/skills/registry/skill-registry.py "confirm the backstage of this service blueprint" --confidence)
          echo "$out"
          echo "$out" | grep -q "✓ confident" && echo "$out" | grep -q "1\. Service Blueprint"
      - name: Seminar smoke test
        run: python3 sheerline/seminar/smoke_test.py
      - name: Eval coverage
        run: python3 sheerline/skills/evals/measure_coverage.py
      - name: Routing battery
        run: python3 sheerline/skills/evals/routing-battery/run_battery.py
      - name: Studio link check
        run: python3 sheerline/studio/scripts/link-check.py
